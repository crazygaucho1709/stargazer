name: 🚀 Deploy Stargazer
on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Pull → Build → Restart
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: 📥 Pull latest code
        run: |
          cd /Users/matt/dev/project/web/stargazer
          # Auth via GITHUB_TOKEN pour éviter tout blocage interactif
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/crazygaucho1709/stargazer.git
          git fetch --all
          git reset --hard origin/main
          echo "✅ Code updated to $(git rev-parse --short HEAD)"

      - name: 📦 Install Node dependencies
        run: |
          cd /Users/matt/dev/project/web/stargazer
          npm ci --prefer-offline
          echo "✅ npm dependencies installed"

      - name: 🏗️ Build Next.js
        run: |
          cd /Users/matt/dev/project/web/stargazer
          npm run build
          echo "✅ Next.js build complete"

      - name: 🐍 Install Python dependencies
        run: |
          cd /Users/matt/dev/project/web/stargazer
          echo "Current directory: $(pwd)"
          
          # Si le dossier venv existe mais que le binaire python3 est absent, on purge
          if [ -d "server/venv" ] && [ ! -f "server/venv/bin/python3" ]; then
            echo "⚠️ venv seems broken, removing it..."
            rm -rf server/venv
          fi

          # Création si nécessaire
          if [ ! -d "server/venv" ]; then
            echo "🚀 Creating new virtual environment..."
            python3 -m venv server/venv
          fi

          echo "✅ venv directory check:"
          ls -F server/venv/bin/python3 || echo "❌ python3 NOT FOUND in venv"

          # Install/Update
          ./server/venv/bin/python3 -m pip install --upgrade pip
          ./server/venv/bin/pip install --no-cache-dir -r server/requirements.txt
          
          # Verification
          ./server/venv/bin/python3 -c "import dotenv; print('✅ python-dotenv is verified')"
          echo "✅ Python dependencies OK"

      - name: ♻️ Restart services
        run: |
          cd /Users/matt/dev/project/web/stargazer
          # 'pm2 start' reloads the config file and updates existing processes
          pm2 start ecosystem.config.js --update-env
          pm2 save
          echo "✅ PM2 services updated and restarted"

      - name: 🏥 Health check
        run: |
          sleep 10
          # Backend health
          HEALTH=$(curl -sf http://localhost:5005/health || echo '{}')
          echo "Backend: $HEALTH"
          if echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "✅ Backend healthy"
          else
            echo "❌ Backend health check failed"
            pm2 logs stargazer-backend --lines 50
            exit 1
          fi
          # Frontend health
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "Frontend HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend healthy"
          else
            echo "❌ Frontend returned $HTTP_CODE"
            pm2 logs stargazer-frontend --lines 50
            exit 1
          fi

      - name: 📢 Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          AUTHOR="${{ github.actor }}"
          echo "Deploy $STATUS | $SHORT by $AUTHOR"
