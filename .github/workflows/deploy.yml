name: 🚀 Deploy Stargazer
on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Pull → Build → Restart
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      DEPLOY_PATH: /Users/matthieudelamourd/dev/project/web/stargazer

    steps:
      - name: 🔍 Debug Environment
        run: |
          echo "Current User: $(whoami)"
          echo "Home: $HOME"
          echo "PWD: $(pwd)"
          ls -ld /Users/*

      - name: 📥 Pull latest code
        run: |
          cd ${{ env.DEPLOY_PATH }}
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/crazygaucho1709/stargazer.git
          git fetch --all
          git reset --hard origin/main
          echo "✅ Code updated to $(git rev-parse --short HEAD)"
          git log -1 --pretty=format:"%h - %s (%an)"
          echo ""

      - name: 📦 Install Node dependencies
        run: |
          cd ${{ env.DEPLOY_PATH }}
          npm ci --prefer-offline
          echo "✅ npm dependencies installed"

      - name: 🏗️ Build Next.js
        run: |
          cd ${{ env.DEPLOY_PATH }}
          # Clean old build artifacts to avoid chunk mismatches
          rm -rf .next
          npm run build
          echo "✅ Next.js build complete"
          
          # Verify static assets exist
          if [ -d ".next/static/chunks" ]; then
            echo "✅ Static chunks generated:"
            ls .next/static/chunks | head -n 10
          else
            echo "❌ Static chunks NOT FOUND"
            exit 1
          fi

      - name: 🐍 Install Python dependencies
        run: |
          cd ${{ env.DEPLOY_PATH }}
          if [ -d "server/venv" ] && [ ! -f "server/venv/bin/python3" ]; then
            rm -rf server/venv
          fi
          if [ ! -d "server/venv" ]; then
            python3 -m venv server/venv
          fi
          ./server/venv/bin/python3 -m pip install --upgrade pip
          ./server/venv/bin/pip install --no-cache-dir -r server/requirements.txt
          ./server/venv/bin/python3 -c "import dotenv; print('✅ python-dotenv is verified')"
          echo "✅ Python dependencies OK"

      - name: ♻️ Restart services
        run: |
          cd ${{ env.DEPLOY_PATH }}
          # Aggressive cleanup to ensure no ghost processes
          mkdir -p logs
          pm2 delete all || true
          
          # Targeted cleanup to avoid killing the GitHub runner itself
          lsof -ti:3000 | xargs kill -9 || true
          lsof -ti:5005 | xargs kill -9 || true
          sleep 2
          
          # Start fresh
          pm2 start ecosystem.config.js --update-env
          pm2 save
          
          echo "✅ PM2 status after restart:"
          pm2 list
          echo "✅ PM2 details for frontend:"
          pm2 show stargazer-frontend
          
          echo "🔍 Waiting for startup..."
          sleep 10
          
          echo "--- Frontend Error Log ---"
          [ -f logs/frontend-error.log ] && tail -n 50 logs/frontend-error.log || echo "No error log found"
          echo "--- Frontend Out Log ---"
          [ -f logs/frontend-out.log ] && tail -n 50 logs/frontend-out.log || echo "No out log found"
          
          echo "✅ PM2 services updated and restarted"

      - name: 🏥 Health check
        run: |
          sleep 10
          # Backend health
          HEALTH=$(curl -sf http://localhost:5005/health || echo '{}')
          echo "Backend: $HEALTH"
          if echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "✅ Backend healthy"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi
          # Frontend health
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "Frontend HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            # Verify if at least one chunk is accessible (basic check for 404s)
            CHUNK=$(ls ${{ env.DEPLOY_PATH }}/.next/static/chunks/*.js | head -n 1 | xargs basename)
            CHUNK_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/_next/static/chunks/$CHUNK)
            echo "Static Chunk Check ($CHUNK): $CHUNK_CODE"
            if [ "$CHUNK_CODE" = "200" ]; then
                echo "✅ Frontend healthy and assets accessible"
            else
                echo "❌ Static assets returned $CHUNK_CODE"
                exit 1
            fi
          else
            echo "❌ Frontend returned $HTTP_CODE"
            exit 1
          fi

      - name: 📢 Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          AUTHOR="${{ github.actor }}"
          echo "Deploy $STATUS | $SHORT by $AUTHOR"
